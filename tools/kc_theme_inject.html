<!-- ===================================================================
     FEAT-005 S1+S2 · KC 主题注入：顶部导航框架 + 四页样式重排
     -------------------------------------------------------------------
     注入位置：custom_html（第三份拼接源，晚于 activate/panel）
     S1 组成：
       1. 设计 token CSS（teal #0d9488 体系，light/dark 自适应）
       2. 顶部导航条：logo + 3 路由主项（首页/商品/我的订单）+ 充值按钮
          + 余额徽章 + 头像下拉
       3. 头像下拉：个人中心/我的邀请/我的工单/使用文档/节点状态/流量明细
          /兑换卡密/退出登录
       4. 移动端(<860px)：☰ 抽屉（全部入口聚合）
       5. 隐藏原侧栏 aside.n-layout-sider（recon-xb3 实测选择器）
     S2 组成（_s2_recon*/ 侦察实测）：
       6. 隐藏原生页头 article > header（面包屑+主题/字号/全屏/邮箱，与顶栏重复）
       7. dashboard 门户区块 #kc-portal（hero 代充宣传 + 功能宫格 6 入口
          + 三步引导 + 热门套餐 3 卡 + 帮助条），挂在 section.cus-scroll-y 顶部；
          门户模式下隐藏原生 dashboard 内容（carousel/我的订阅/捷径）；
          热门套餐 = plan/fetch 过滤「有周期价」的订阅套餐按 sort 取前 3
          （plan/fetch 无库存/销量字段；余额充值类 onetime 套餐被过滤）
       8. plan 页 CSS 网格卡片化（card-container → grid）+ 首个订阅套餐推荐角标
       9. order 页表格卡片化 + 状态语义着色（按行内状态文本匹配，MutationObserver 保活）
     路由映射（_recon-xb3.js 逐项点击实测）：
       首页→#/dashboard 商品→#/plan 订单→#/order
       个人中心→#/profile 邀请→#/invite 工单→#/ticket
       文档→#/knowledge 节点→#/node 流量→#/traffic
     充值/兑卡：程序化 click #kc-float-topup / #kc-float-redeem
     （kc_panel_inject.html 提供的浮动按钮，全站常驻）
     未登录 / #/login 页不注入；退出登录后自动摘除，重新登录后自动恢复
     =================================================================== -->
<style>
  /* ============ 设计 token ============ */
  /* 同时挂在 :root 上：游客落地页（#/login，无 kc-has-topbar）也要用到这套变量 */
  :root, body.kc-has-topbar {
    --kc-brand: #0d9488;
    --kc-brand-hover: #0f766e;
    --kc-brand-soft: rgba(13, 148, 136, .10);
    --kc-h: 56px;
    --kc-tb-bg: #ffffff;
    --kc-tb-border: #ececf1;
    --kc-tb-text: #1f2329;
    --kc-tb-sub: #8a8f99;
    --kc-menu-bg: #ffffff;
    --kc-hover: #f3f4f6;
    /* S2 门户/卡片用扩展 token */
    --kc-page-bg: #f6f8fa;
    --kc-card-bg: #ffffff;
    --kc-card-border: #e8edf2;
    --kc-t1: #0f172a;
    --kc-t2: #475569;
    --kc-t3: #94a3b8;
    --kc-green: #16a34a;
    --kc-blue: #3b82f6;
    --kc-red: #ef4444;
  }
  body.kc-has-topbar.kc-dark {
    --kc-brand-soft: rgba(20, 184, 166, .16);
    --kc-tb-bg: #1c1c1f;
    --kc-tb-border: #2f2f33;
    --kc-tb-text: #f2f2f3;
    --kc-tb-sub: #9a9aa3;
    --kc-menu-bg: #242428;
    --kc-hover: #2a2a30;
    --kc-page-bg: #141416;
    --kc-card-bg: #1e1e22;
    --kc-card-border: #2f2f35;
    --kc-t1: #f2f2f3;
    --kc-t2: #b8bcc4;
    --kc-t3: #7c8089;
  }
  /* ============ 布局复位：顶栏占位 + 隐藏侧栏 ============ */
  body.kc-has-topbar {
    padding-top: var(--kc-h) !important;
    box-sizing: border-box !important;
    height: 100vh !important;
    overflow: hidden !important;
  }
  body.kc-has-topbar aside.n-layout-sider { display: none !important; }
  /* ============ 顶部导航条 ============ */
  #kc-topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--kc-h);
    z-index: 900; background: var(--kc-tb-bg);
    border-bottom: 1px solid var(--kc-tb-border);
    animation: kcSlideDown .25s ease;
  }
  .kc-tb-inner {
    height: 100%; padding: 0 20px;
    display: flex; align-items: center; gap: 6px;
  }
  .kc-tb-burger {
    display: none; align-items: center; justify-content: center;
    width: 36px; height: 36px; margin-right: 2px;
    border: 0; border-radius: 8px; background: transparent;
    color: var(--kc-tb-text); cursor: pointer;
  }
  .kc-tb-burger:hover { background: var(--kc-hover); }
  .kc-tb-logo {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; flex-shrink: 0;
  }
  .kc-tb-logo-badge {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .5px;
    box-shadow: 0 2px 8px rgba(13, 148, 136, .35);
  }
  .kc-tb-logo-text {
    font-size: 16px; font-weight: 700; color: var(--kc-tb-text);
    white-space: nowrap;
  }
  .kc-tb-nav { display: flex; align-items: center; gap: 4px; margin-left: 28px; }
  .kc-tb-nav a {
    display: flex; align-items: center; height: 34px; padding: 0 15px;
    border-radius: 9px; color: var(--kc-tb-sub); font-size: 14px;
    font-weight: 500; text-decoration: none; white-space: nowrap;
    transition: color .15s, background .15s;
  }
  .kc-tb-nav a:hover { color: var(--kc-tb-text); background: var(--kc-hover); }
  .kc-tb-nav a.kc-active {
    color: var(--kc-brand); background: var(--kc-brand-soft); font-weight: 600;
  }
  .kc-tb-right { margin-left: auto; display: flex; align-items: center; }
  .kc-tb-topup-btn {
    display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 16px;
    border: 0; border-radius: 17px; background: var(--kc-brand); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 8px rgba(13, 148, 136, .35);
    transition: background .15s, transform .1s; white-space: nowrap;
  }
  .kc-tb-topup-btn:hover { background: var(--kc-brand-hover); }
  .kc-tb-topup-btn:active { transform: scale(.96); }
  .kc-tb-balance {
    display: flex; align-items: center; height: 34px; padding: 0 12px;
    margin-left: 8px; border-radius: 9px; background: var(--kc-brand-soft);
    color: var(--kc-brand); font-size: 13px; font-weight: 600;
    text-decoration: none; white-space: nowrap;
  }
  .kc-tb-user { position: relative; margin-left: 8px; }
  .kc-tb-avatar {
    width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #14b8a6, #0d9488); color: #fff;
    font-size: 14px; font-weight: 700; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .kc-tb-menu {
    position: absolute; right: 0; top: calc(100% + 8px); width: 184px;
    background: var(--kc-menu-bg); border: 1px solid var(--kc-tb-border);
    border-radius: 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .14);
    padding: 6px; display: none; z-index: 910;
  }
  .kc-tb-user.kc-open .kc-tb-menu { display: block; animation: kcFadeIn .15s ease; }
  .kc-tb-menu-head {
    padding: 8px 10px 7px; border-bottom: 1px solid var(--kc-tb-border);
    margin-bottom: 4px;
  }
  .kc-tb-menu-head b {
    font-size: 12px; font-weight: 600; color: var(--kc-tb-sub);
    word-break: break-all; display: block;
  }
  .kc-tb-mi {
    display: block; width: 100%; text-align: left; border: 0;
    background: transparent; padding: 8px 10px; border-radius: 8px;
    color: var(--kc-tb-text); font-size: 13px; text-decoration: none;
    cursor: pointer; font-family: inherit;
  }
  .kc-tb-mi:hover { background: var(--kc-hover); color: var(--kc-brand); }
  .kc-tb-menu-sep { height: 1px; background: var(--kc-tb-border); margin: 4px 6px; }
  .kc-tb-logout { color: #e5484d; }
  .kc-tb-logout:hover { color: #e5484d; background: rgba(229, 72, 77, .08); }
  /* ============ 移动端抽屉 ============ */
  #kc-drawer-mask {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 940;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #kc-drawer-mask.kc-show { opacity: 1; pointer-events: auto; }
  #kc-drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(78vw, 320px);
    z-index: 950; background: var(--kc-menu-bg);
    border-right: 1px solid var(--kc-tb-border);
    transform: translateX(-105%); transition: transform .25s ease;
    display: flex; flex-direction: column; padding: 14px 14px 18px;
    box-sizing: border-box; overflow-y: auto;
  }
  #kc-drawer.kc-show { transform: translateX(0); }
  .kc-drawer-head {
    display: flex; align-items: center; gap: 8px; padding: 4px 4px 12px;
  }
  .kc-drawer-head b { font-size: 16px; color: var(--kc-tb-text); flex: 1; }
  .kc-drawer-close {
    border: 0; background: transparent; color: var(--kc-tb-sub);
    font-size: 20px; cursor: pointer; padding: 4px 8px;
  }
  .kc-drawer-bal {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-radius: 12px; background: var(--kc-brand-soft);
    margin-bottom: 12px;
  }
  .kc-drawer-bal span { font-size: 12px; color: var(--kc-tb-sub); }
  .kc-drawer-bal b { font-size: 16px; color: var(--kc-brand); }
  .kc-drawer-cap {
    font-size: 11px; color: var(--kc-tb-sub); padding: 8px 8px 4px;
    letter-spacing: 1px;
  }
  .kc-drawer-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .kc-drawer-nav a, .kc-drawer-nav button {
    display: block; text-align: left; border: 0; background: transparent;
    padding: 11px 12px; border-radius: 10px; color: var(--kc-tb-text);
    font-size: 14px; text-decoration: none; cursor: pointer; font-family: inherit;
  }
  .kc-drawer-nav a:hover, .kc-drawer-nav button:hover { background: var(--kc-hover); }
  .kc-drawer-nav a.kc-active {
    color: var(--kc-brand); background: var(--kc-brand-soft); font-weight: 600;
  }
  .kc-drawer-logout {
    border: 1px solid var(--kc-tb-border); background: transparent;
    padding: 10px; border-radius: 10px; color: #e5484d; font-size: 14px;
    cursor: pointer; font-family: inherit; margin-top: 10px;
  }
  @media (max-width: 860px) {
    .kc-tb-nav { display: none; }
    .kc-tb-burger { display: flex; }
    .kc-tb-logo-text { display: none; }
    .kc-tb-balance { margin-left: auto; }
    .kc-tb-user { margin-left: 6px; }
    .kc-tb-topup-btn { padding: 0 12px; }
  }
  /* ==================================================================
     S2 · 四页样式重排
     ================================================================== */
  /* --- 隐藏原生页头：面包屑 + 主题/字号/全屏/邮箱，与 KC 顶栏功能重复 --- */
  body.kc-has-topbar .n-layout-scroll-container > article > header {
    display: none !important;
  }
  /* --- dashboard 门户区块 --- */
  /* 门户模式下隐藏原生 dashboard 内容（carousel/我的订阅/捷径），门户挂载成功才生效（渐进增强） */
  body.kc-has-topbar.kc-on-dashboard section.cus-scroll-y.kc-portal-on > div:not(#kc-portal):not(.n-back-top-placeholder) { display: none !important; }
  body.kc-has-topbar:not(.kc-on-dashboard) #kc-portal { display: none !important; }
  #kc-portal, #kc-guest { max-width: 1200px; margin: 0 auto; width: 100%; padding: 4px 4px 28px; }
  /* R3 游客落地页：品牌顶栏 + 原生登录卡改造为弹层 */
  #kc-guest-topbar {
    position: sticky; top: 0; z-index: 960; box-sizing: border-box;
    background: #04342C; color: #fff; display: flex; align-items: center; gap: 20px;
    padding: 10px 22px; font-size: 13px; max-width: 1200px; margin: 0 auto; width: 100%;
    border-radius: 0 0 12px 12px;
  }
  #kc-guest-topbar .kc-gt-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  #kc-guest-topbar .kc-gt-logo { background: #0F6E56; border-radius: 6px; padding: 2px 7px; font-size: 12px; font-weight: 700; }
  #kc-guest-topbar .kc-gt-nav { display: flex; gap: 18px; }
  #kc-guest-topbar .kc-gt-nav a { color: rgba(255, 255, 255, .72); text-decoration: none; }
  #kc-guest-topbar .kc-gt-nav a:hover { color: #fff; }
  #kc-guest-topbar .kc-gt-login {
    margin-left: auto; background: #1D9E75; border: 0; border-radius: 8px; color: #fff;
    padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  #kc-guest-topbar .kc-gt-login:hover { opacity: .92; }
  body.kc-guest-on .wh-full.flex.items-center { display: none !important; }
  /* 游客落地页滚动修复：原生登录页把 html/body 锁成 overflow:hidden + height:100%（为居中卡片设计），
     落地页内容超出后被裁切且无任何可滚动容器 → 游客态解除锁定 */
  html.kc-guest-scroll, html.kc-guest-scroll body {
    height: auto !important; max-height: none !important; overflow: visible !important; overflow-y: auto !important;
  }
  html.kc-guest-scroll body { min-height: 100vh; }
  /* 游客落地页首帧压制：落地页挂载前，原生登录卡不可见（避免「先闪登录页再变落地页」） */
  html.kc-pre-guest .wh-full.flex.items-center { display: none !important; }
  body.kc-guest-login .wh-full.flex.items-center {
    display: flex !important; position: fixed !important; inset: 0; z-index: 9990;
    background: rgba(4, 52, 44, .55); align-items: center; justify-content: center; padding: 24px;
  }
  body.kc-guest-login .wh-full.flex.items-center > .n-card { box-shadow: 0 20px 60px rgba(0, 0, 0, .35); border-radius: 16px; }
  /* 刷新闪现压制（R2）：门户挂载前原生 dashboard 内容不可见；用 visibility 保持布局让图表等正常初始化 */
  html.kc-pre-dash .n-layout-scroll-container > article > header,
  html.kc-pre-app .n-layout-scroll-container > article > header,
  html.kc-pre-dash section.cus-scroll-y > :not(#kc-portal),
  html.kc-pre-app section.cus-scroll-y > :not(#kc-portal) { visibility: hidden !important; }
  /* 原生左侧竖导航也一并压制（用户实测：仅藏页头+内容区时 sider 仍会闪现）；display 与正常态隐藏方式一致 */
  html.kc-pre-dash aside.n-layout-sider,
  html.kc-pre-app aside.n-layout-sider { display: none !important; }
  /* FEAT-016 登录落地压制期：原生内容被藏、门户未挂的窗口里不要留刺眼纯白，
     用品牌浅底 + 顶部品牌条过渡，视觉上「有东西在加载」而不是「白屏一闪」 */
  html.kc-login-suppress body {
    background: var(--kc-page-bg, #f6f8fa) !important;
  }
  html.kc-login-suppress body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; height: 3px;
    background: var(--kc-brand, #0d9488); z-index: 99999;
    animation: kcLoadBar 1.1s ease-in-out infinite;
  }
  @keyframes kcLoadBar {
    0% { opacity: .35; } 50% { opacity: 1; } 100% { opacity: .35; }
  }
  @media (prefers-reduced-motion: reduce) {
    html.kc-login-suppress body::before { animation: none; opacity: .8; }
  }

  .kc-portal-hero h2 { font-size: 26px; font-weight: 800; margin: 0 0 8px; letter-spacing: .5px; }

  .kc-gi-new {

<script>
(function () {

        if (tok) { h['Authorization'] = normAuth(tok); }
        var opt = { method: method, headers: h, credentials: 'same-origin' };
        if (body !== undefined) { h['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
        return fetch(path, opt).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) {
                if (r.ok && j && (j.status === 'success' || typeof j.data !== 'undefined')) {
                    return { ok: true, data: j.data === undefined ? j : j.data };
                }
                return { ok: false, error: (j && j.message) || ('HTTP ' + r.status) };
            });
        }).catch(function (e) { return { ok: false, error: '网络错误，请稍后重试' }; });
    }

                '<div class="kc-g-note">🔒 只在浏览器本地解析，不做联网校验；是否可用由开通环节反馈。</div>' +
                '</div>';
            foot.innerHTML = '<button class="kc-g-btn ghost" type="button" data-action="guide-prev">← 上一步</button>' +
                '<button class="kc-g-btn primary" type="button" data-action="guide-next" ' + (kcSelCount() ? '' : 'disabled') + '>下一步：确认订单 →</button>';
            kcRenderStat();
            kcRenderPickList();
            kcRenderPickSum();
            var ta = document.getElementById('kc-g-ta');
            if (ta) {
                ta.addEventListener('input', function () {
                    kcG.raw = ta.value;
                    kcG.parsed = kcParseSessions(kcG.raw);
                    kcSyncPicked();
                    kcRenderStat();
                    kcRenderPickList();
                    kcRenderPickSum(); kcRenderGuideFoot();
                });
            }
            return;
        }
        // step 4：若已开始支付/开通 → 渲染逐行进度（FEAT-010 段2）
        if (kcG.rows && kcG.rows.length) { kcRenderProgress(); return; }
        // step 4：确认订单（按**已勾选**的账号数计算）
        var picked = (kcG.picked || []).slice();
        var nSel = picked.length;
        var unit2 = Number(plan.priceFen || 0);
        var total2 = unit2 * nSel;
        var bal = kcG.balance;
        var enough = (bal != null) && (bal >= total2);
        var balText = bal == null ? '读取中…' : ('$' + (bal / 100).toFixed(2));
        var pickedRows = picked.map(function (i) {
            var x = (kcG.parsed || [])[i];
            return '<div class="kc-g-row kc-ok" style="margin-bottom:8px;"><div class="kc-g-row-top"><span>' +
                esc((x && x.email) || '(未取到邮箱)') + '</span><span class="kc-g-ok-tag">已选</span></div></div>';
        }).join('');
        body.innerHTML = '<div class="kc-g-h">确认订单并支付</div>' +
            '<div class="kc-g-in">' +
            '<div class="kc-g-stat" style="margin-top:0;">将开通以下 <b>' + nSel + '</b> 个账号：</div>' +
            '<div style="margin-top:10px;">' + (pickedRows || '<div class="kc-g-note" style="margin-top:0;">没有选中任何账号，请返回上一步勾选。</div>') + '</div>' +
            '<div class="kc-g-sum">目标套餐：<b>' + esc(plan.name || '—') + '</b><br>' +
              '单价：<b>$' + (unit2 / 100).toFixed(2) + '</b> × ' + nSel + '<br>' +
              '应付合计：<b class="price">$' + (total2 / 100).toFixed(2) + '</b></div>' +
            '<div style="border-top:1px solid var(--kc-card-border);margin:12px 0;"></div>' +
            '<div class="kc-g-bal"><span>账户余额</span><b>' + balText + '</b></div>' +
            (bal == null ? '' : (enough
                ? '<div class="kc-g-note" style="color:#3B6D11;">✔ 余额充足，支付后立即自动开通</div>'
                : '<div class="kc-g-warn">余额不足：还差 $' + ((total2 - bal) / 100).toFixed(2) + '，请先充值后支付</div>')) +
            '<div class="kc-g-note">支付后无需任何操作：系统自动开通并显示实时进度。</div>' +
            '</div>';
        foot.innerHTML = '<button class="kc-g-btn ghost" type="button" data-action="guide-prev">← 上一步</button>' +
            (enough && nSel
                ? '<button class="kc-g-btn primary" type="button" data-action="guide-pay">确认支付 $' + (total2 / 100).toFixed(2) + ' →</button>'
                : (nSel ? '<button class="kc-g-btn warn" type="button" data-action="guide-topup">去充值 →</button>' : ''));
    }
    // 勾选变化后只重画底部按钮（第3步）
    function kcRenderGuideFoot() {
        var foot = document.getElementById('kc-g-foot');
        if (!foot || kcG.step !== 3) { return; }
        var n = kcSelCount();
        foot.innerHTML = '<button class="kc-g-btn ghost" type="button" data-action="guide-prev">← 上一步</button>' +
            '<button class="kc-g-btn primary" type="button" data-action="guide-next"' + (n ? '' : ' disabled') + '>' +
            (n ? ('下一步：确认订单（' + n + ' 个） →') : '请先勾选账号') + '</button>';
    }
    function kcGuideNext() {
        if (kcG.step === 3 && kcSelCount() === 0) { return; }
        if (kcG.step < 4) { kcG.step++; kcRenderGuide(); }
    }
    function kcGuidePrev() {
        if (kcG.step > 1) { kcG.step--; kcRenderGuide(); }
    }
    // 触发：代充类商品卡片 → 打开向导（非代充走原流程）
    // 【FEAT-014】整卡任何位置都**不**跳转，只有「立即办理」按钮才开向导；
    // 原实现只拦 `.n-card__action button`，点卡片空白处会走 Xboard 原生「整卡可点」→ 跳充值/下单页。
    document.addEventListener('click', function (e) {
        if (!isPlanPage() || isConfirmPage()) { return; }
        var card = e.target.closest && e.target.closest('.card-container .n-card');
        if (!card) { return; }
        var cat = card.getAttribute('data-kc-cat') || 'recharge';
        if (cat !== 'recharge') { return; }
        if (card.getAttribute('data-kc-card') !== '1') { return; }
        // P1「购买卡密」次级入口（经典下单→收银台→发卡；后台可随时关闭）
        var buyEl = e.target.closest && e.target.closest('.kc-cb-buy');
        if (buyEl) {
            e.preventDefault();
            e.stopPropagation();
            kcOpenCardBuy(card);
            return;
        }
        // 只有点「立即办理」按钮才放行；点卡片其他位置一律吞掉（不跳任何页）
        var btn = e.target.closest('.n-card__action button');
        if (!btn) { e.preventDefault(); e.stopPropagation(); return; }
        e.preventDefault();
        e.stopPropagation();
        kcOpenGuide({
            id: card.getAttribute('data-kc-plan-id') || '',
            name: card.getAttribute('data-kc-plan-name') || 'ChatGPT 代充',
            priceFen: Number(card.getAttribute('data-kc-price-fen') || 0),
            priceLabel: card.getAttribute('data-kc-price-label') || ''
        });
    }, true);
    // 步骤条点击切换（圆形步骤条）
    document.addEventListener('click', function (e) {
        if (!e.target.closest) { return; }
        var st = e.target.closest('#kc-guide .kc-g-step[data-goto]');
        if (!st) { return; }
        e.preventDefault();
        kcGuideGoto(st.getAttribute('data-goto'));
    }, true);
    // 勾选列表项点击（整行可点）
    document.addEventListener('click', function (e) {
        if (!e.target.closest) { return; }
        var it = e.target.closest('#kc-guide .kc-g-pitem[data-pick]');
        if (!it) { return; }
        e.preventDefault();
        var i = parseInt(it.getAttribute('data-pick'), 10);
        if (isNaN(i)) { return; }
        kcTogglePick(i, (kcG.picked || []).indexOf(i) < 0);
    }, true);
    // 向导内部按钮（document 级委托，只注册一次）
    document.addEventListener('click', function (e) {
        if (!e.target.closest) { return; }
        var act = e.target.closest('#kc-guide [data-action]');
        if (!act) { return; }
        var a = act.getAttribute('data-action');
        if (a === 'guide-close') { kcCloseGuide(); }
        else if (a === 'guide-next') { kcGuideNext(); }
        else if (a === 'guide-prev') { kcGuidePrev(); }
        else if (a === 'kb-open-chatgpt') { try { window.open('https://chatgpt.com/', '_blank'); } catch (err) { } }
        else if (a === 'guide-topup') { openRechargePage(); }
        else if (a === 'guide-pay') { kcGuidePay(); }
        else if (a === 'guide-retry') { kcRetryRow(parseInt(act.getAttribute('data-i'), 10) || 0); }
        else if (a === 'kb-open-session') { try { window.open('https://chatgpt.com/api/auth/session', '_blank', 'noopener'); } catch (err) { } }
        else if (a === 'pick-all') { kcPickAll(true); }
        else if (a === 'pick-none') { kcPickAll(false); }
        else if (a === 'kb-orders') { kcCloseGuide(); window.location.hash = '#/order'; }
        else if (a === 'kb-ticket') { kcCloseGuide(); window.location.hash = '#/ticket'; }
    });
    function kcRetryRow(i) {
        var row = kcG.rows && kcG.rows[i];
        if (!row || kcG.paying) { return; }
        kcG.paying = true; kcRenderGuide();
        var chain;
        if (row.cdk) {
            // 断点：已有卡密 → 直接重新提交开通
            row.state = 'opening';
            row.msg = '正在重新提交开通…';
            chain = kcApiJson('POST', '/kc/redeem/start', { cdk: row.cdk, session: String(row.session || '') })
                .then(function (r2) {
                    if (!r2.ok) { throw new Error(r2.error || '提交开通失败'); }
                    row.msg = '开通处理中…'; kcRenderGuide();
                    return kcPollStatus(row, 0);
                });
        } else if (row.tradeNo) {
            // 断点：已下单未发卡 → 从等卡密继续（不重复下单）
            row.state = 'ordering';
            row.msg = '继续等待系统发卡…';
            chain = kcWaitCard(row, 0).then(function (cdk) {
                row.cdk = cdk;
                row.state = 'opening';
                row.msg = '正在提交开通…'; kcRenderGuide();
                return kcApiJson('POST', '/kc/redeem/start', { cdk: cdk, session: String(row.session || '') });
            }).then(function (r2) {
                if (!r2.ok) { throw new Error(r2.error || '提交开通失败'); }
                row.msg = '开通处理中…'; kcRenderGuide();
                return kcPollStatus(row, 0);
            });
        } else {
            // 未下单 → 完整重来
            row.state = 'ordering';
            row.msg = '正在下单…';
            chain = kcApiJson('POST', '/api/v1/user/order/save', { plan_id: kcG.plan.id, period: 'month_price' })
                .then(function (r) {
                    if (!r.ok) { throw new Error(r.error || '下单失败'); }
                    row.tradeNo = typeof r.data === 'string' ? r.data : ((r.data && r.data.trade_no) || '');
                    if (!row.tradeNo) { throw new Error('未取到订单号'); }
                    return kcApiJson('POST', '/kc/order/pay-balance', { trade_no: row.tradeNo });
                }).then(function (rp) {
                    if (!rp.ok) { throw new Error(rp.error || '余额结算失败'); }
                    row.msg = '订单已完成，等待系统发卡…'; kcRenderGuide();
                    return kcWaitCard(row, 0);
                }).then(function (cdk) {
                    row.cdk = cdk;
                    row.state = 'opening';
                    row.msg = '正在提交开通…'; kcRenderGuide();
                    return kcApiJson('POST', '/kc/redeem/start', { cdk: cdk, session: String(row.session || '') });
                }).then(function (r2) {
                    if (!r2.ok) { throw new Error(r2.error || '提交开通失败'); }
                    row.msg = '开通处理中…'; kcRenderGuide();
                    return kcPollStatus(row, 0);
                });
        }
        chain.then(function () {
            row.state = 'done';
            row.progress = 100;
            row.msg = '开通完成';
        }).catch(function (e) {
            row.state = 'failed';
            row.msg = (e && e.message) ? e.message : '重试失败';
        }).then(function () {
            kcG.paying = false; kcRenderGuide();
        });
    }
    // ===== FEAT-010 段2 · 余额支付 + 自动开通（逐账号串行；用户全程看不到卡密）=====
    function kcApiJson(method, path, body) {
        var h = { 'Accept': 'application/json' };
        var tok = readToken();
        if (tok) { h['Authorization'] = normAuth(tok); }
        var opt = { method: method, headers: h, credentials: 'same-origin' };
        if (body !== undefined) { h['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
        return fetch(path, opt).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) {
                if (r.ok && j && (j.status === 'success' || typeof j.data !== 'undefined' || j.success === true)) {
                    return { ok: true, data: (j.data !== undefined ? j.data : j) };
                }
                return { ok: false, error: (j && (j.message || j.error)) || ('HTTP ' + r.status) };
            });
        }).catch(function (e) { return { ok: false, error: '网络错误，请稍后重试' }; });
    }
    function kcGuidePay() {
        if (kcG.paying) { return; }
        // 只开通**用户勾选**的账号（FEAT-011）
        var picked = (kcG.picked || []).slice().sort(function (a, b) { return a - b; });
        var okRows = picked.map(function (i) { return (kcG.parsed || [])[i]; })
            .filter(function (x) { return x && x.ok; });
        if (!okRows.length) { return; }
        kcG.paying = true;
        kcG.rows = okRows.map(function (x) {
            return {
                email: x.email, session: String(x.raw || x.token || ''), plan: x.plan,
                state: 'pending', msg: '等待处理', progress: 0, cdk: '', tradeNo: ''
            };
        }); kcRenderGuide();
        kcPaySequential(0);
    }
    function kcPaySequential(i) {
        if (i >= kcG.rows.length) {
            kcG.paying = false;
            // 完成后立即清除本地 Session（不再需要，但保留 rows 让用户看到逐行结果）
            kcG.raw = '';
            kcG.parsed = [];
            kcG.picked = [];
            try { sessionStorage.removeItem('kc_guide_state'); } catch (e) { }
            kcRenderGuide();
            return;
        }
        var row = kcG.rows[i];
        row.state = 'ordering';
        row.msg = '正在下单…'; kcRenderGuide();
        kcApiJson('POST', '/api/v1/user/order/save', { plan_id: kcG.plan.id, period: 'month_price' })
            .then(function (r) {
                if (!r.ok) { throw new Error(r.error || '下单失败'); }
                row.tradeNo = typeof r.data === 'string' ? r.data : ((r.data && r.data.trade_no) || '');
                if (!row.tradeNo) { throw new Error('未取到订单号'); }
                row.msg = '已扣款，正在完成订单…'; kcRenderGuide();
                // 余额已自动抵扣（total=0）→ 调插件接口推进订单履约（Xboard 原生不会自动完成纯余额订单）
                return kcApiJson('POST', '/kc/order/pay-balance', { trade_no: row.tradeNo });
            })
            .then(function (rp) {
                if (!rp.ok) { throw new Error(rp.error || '余额结算失败'); }
                row.msg = '订单已完成，等待系统发卡…'; kcRenderGuide();
                return kcWaitCard(row, 0);
            })
            .then(function (cdk) {
                row.cdk = cdk;
                row.state = 'opening';
                row.msg = '正在提交开通…'; kcRenderGuide();
                return kcApiJson('POST', '/kc/redeem/start', { cdk: cdk, session: String(row.session || '') });
            })
            .then(function (r2) {
                if (!r2.ok) { throw new Error(r2.error || '提交开通失败'); }
                row.msg = '开通处理中…'; kcRenderGuide();
                return kcPollStatus(row, 0);
            })
            .then(function () {
                row.state = 'done';
                row.progress = 100;
                row.msg = '开通完成'; kcRenderGuide();
                kcPaySequential(i + 1);
            })
            .catch(function (e) {
                row.state = 'failed';
                row.msg = (e && e.message) ? e.message : '处理失败'; kcRenderGuide();
                kcPaySequential(i + 1);
            });
    }
    // 等系统发卡（订单完成后插件自动发放卡密）
    function kcWaitCard(row, n) {
        return new Promise(function (resolve, reject) {
            kcApiJson('GET', '/user/kc/card?trade_no=' + encodeURIComponent(row.tradeNo)).then(function (r) {
                var d = r.ok ? (r.data || {}) : {};
                var cdk = String(d.cdk || '').trim();
                if (cdk) { resolve(cdk); return; }
                if (n >= 40) { reject(new Error('等待发卡超时，请到「我的订单」查看或联系客服')); return; }
                row.msg = '等待系统发卡…（' + (n + 1) + '）'; kcRenderGuide();
                setTimeout(function () { kcWaitCard(row, n + 1).then(resolve).catch(reject); }, 1500);
            }).catch(function () {
                if (n >= 40) { reject(new Error('查询卡密失败')); return; }
                setTimeout(function () { kcWaitCard(row, n + 1).then(resolve).catch(reject); }, 1500);
            });
        });
    }
    // 轮询开通进度（真实进度来自上游）
    function kcPollStatus(row, n) {
        return new Promise(function (resolve, reject) {
            kcApiJson('GET', '/kc/redeem/status?cdk=' + encodeURIComponent(row.cdk)).then(function (r) {
                var d = (r.ok && r.data) ? r.data : {};
                // ⚠️ 插件返回的真实字段是 task_status（下划线）。
                // 只读 d.status / d.taskStatus 会取不到值 → 进度永远判定不了完成 →
                // 5 分钟后误报「开通超时」，而账号其实早已开通成功。
                var st = String(d.task_status || d.taskStatus || d.status || '').toLowerCase();
                var prog = Number(d.progress);
                if (Number.isFinite(prog) && prog > 0) { row.progress = Math.min(99, Math.round(prog)); }
                if (d.message || d.text || d.status_cn) { row.msg = String(d.message || d.text || d.status_cn).slice(0, 80); }
                if (st === 'done' || st === 'success' || st === 'completed') { resolve(true); return; }
                if (st === 'failed' || st === 'fail' || st === 'error') {
                    reject(new Error((d.message || d.error || '开通失败').slice(0, 100)));
                    return;
                }
                if (n >= 100) { reject(new Error('开通超时，可到订单页查看进度或联系客服')); return; }
                kcRenderGuide();
                setTimeout(function () { kcPollStatus(row, n + 1).then(resolve).catch(reject); }, 3000);
            }).catch(function () {
                if (n >= 100) { reject(new Error('查询进度失败')); return; }
                setTimeout(function () { kcPollStatus(row, n + 1).then(resolve).catch(reject); }, 3000);
            });
        });
    }
    var KC_ROW_LABEL = { pending: '等待处理', ordering: '下单中', opening: '开通中', done: '已完成', failed: '失败' };
    function kcRenderProgress() {
        var body = document.getElementById('kc-g-body');
        var foot = document.getElementById('kc-g-foot');
        if (!body || !foot) { return; }
        var rows = kcG.rows || [];
        var doneN = rows.filter(function (r) { return r.state === 'done'; }).length;
        var failN = rows.filter(function (r) { return r.state === 'failed'; }).length;
        var allEnd = !kcG.paying;
        var rowsHtml = rows.map(function (r, idx) {
            var cls = r.state === 'done' ? 'kc-ok' : (r.state === 'failed' ? 'kc-bad' : '');
            var tag = r.state === 'done' ? '<span class="kc-g-ok-tag">✔ 已完成</span>'
                : (r.state === 'failed' ? '<span class="kc-g-bad-tag">✕ 失败</span>'
                : '<span style="font-size:11px;color:var(--kc-t3);">' + esc(KC_ROW_LABEL[r.state] || '') + '</span>');
            var bar = (r.state === 'opening')
                ? '<div style="height:6px;border-radius:3px;background:var(--kc-card-border);margin-top:8px;overflow:hidden;"><div style="height:100%;width:' + Math.max(5, r.progress || 5) + '%;background:var(--kc-brand);transition:width .3s;"></div></div>'
                : '';
            return '<div class="kc-g-row ' + cls + '">' +
                '<div class="kc-g-row-top"><span>' + esc(r.email || '(未取到邮箱)') + '</span>' + tag + '</div>' +
                '<div class="kc-g-row-meta">' + esc(r.msg || '') + (r.tradeNo ? (' · 订单 ' + esc(String(r.tradeNo).slice(-8))) : '') + '</div>' + bar +
                (r.state === 'failed' && allEnd ? '<button class="kc-g-btn ghost" type="button" data-action="guide-retry" data-i="' + idx + '" style="margin-top:8px;padding:7px 16px;font-size:12.5px;">重试此账号 →</button>' : '') +
                '</div>';
        }).join('');
        var head = allEnd
            ? (failN === 0 ? '<div class="kc-g-h">🎉 全部开通完成</div><div class="kc-g-p">已为 ' + doneN + ' 个账号完成开通，重新登录 ChatGPT 即可看到新订阅。</div>'
                : '<div class="kc-g-h">处理完成（成功 ' + doneN + ' · 失败 ' + failN + '）</div><div class="kc-g-p">失败的账号可点击下方「联系客服」，我们会按订单核对处理。</div>')
            : '<div class="kc-g-h">正在支付并开通…</div><div class="kc-g-p">请保持页面开启；完成后会自动显示结果，你无需其他操作。</div>';
        body.innerHTML = '<div class="kc-g-card">' + head +
            '<div class="kc-g-rows" style="margin-top:12px;">' + rowsHtml + '</div>' +
            '<div class="kc-g-note">🔒 你提供的登录凭证仅用于本次开通，提交后已从本页面清除。</div>' +
        '</div>';
        foot.innerHTML = allEnd
            ? '<button class="kc-g-btn ghost" type="button" data-action="guide-close">完成</button>' +
              (failN ? '<button class="kc-g-btn warn" type="button" data-action="kb-ticket">联系客服</button>' : '<button class="kc-g-btn primary" type="button" data-action="kb-orders">查看我的订单 →</button>')
            : '<span class="kc-g-note">处理中，请勿关闭页面…</span>';
    }
    // 挂载门户到 dashboard 内容滚动区顶部；成功返回 true
    function mountPortal() {
        var host = document.querySelector('section.cus-scroll-y');
        if (!host) { return false; }
        var portal = document.getElementById('kc-portal');
        if (portal && portal.parentElement === host) { return true; }
        if (!portal) {
            portal = document.createElement('div');
            portal.id = 'kc-portal';
            portal.innerHTML = HTML_PORTAL;
            try {
                if (sessionStorage.getItem('kc_notice_closed') === '1') {
                    var nn = portal.querySelector('#kc-notice');
                    if (nn) { nn.style.display = 'none'; }
                }
            } catch (err) { }
        }
        host.insertBefore(portal, host.firstChild);
        host.classList.add('kc-portal-on');
        releasePreApp();

                    var card = items[i].querySelector('.n-card');
                    if (!card) { continue; }
                    var nameEl = card.querySelector('.n-card-header__main');
                    var name = nameEl ? String(nameEl.textContent || '').trim() : '';
                    var plan = null;
                    for (var j = 0; j < plans.length; j++) { if (plans[j].name === name) { plan = plans[j]; break; } }
                    if (!plan) { plan = plans[i] || null; }
                    if (plan) { applyCardNode(items[i], plan, cfg.cards[String(plan.id)]); }
                }
                setupPlanFilter();
                renderPlanFaq(cfg.faq);
                applyExpectedCategory();
                ensureGoLabelGuard();
                kcFixGoLabel();
                releasePreApp();
            });
        });
        return true;
    }
    function ensurePlanCards() {
        if (planTimer) { clearInterval(planTimer); planTimer = null; }
        var tries = 0;
        applyPlanCards();
        planTimer = setInterval(function () {
            if (!isPlanPage()) { clearInterval(planTimer); planTimer = null; return; }
            var done = applyPlanCards();
            var timeout = (++tries > 30);
            if (done || timeout) { clearInterval(planTimer); planTimer = null; }
            if (timeout) {
                // 仅超时（接口异常等）才解除守卫，让原生卡片可见，避免列表空白
                var items = document.querySelectorAll('.card-container .card-item');
                var allDone = true;
                for (var i = 0; i < items.length; i++) {
                    if (!items[i].querySelector('[data-kc-card="1"]')) { allDone = false; break; }
                }
                if (items.length && !allDone) { document.body.classList.remove('kc-card-guard'); }
            }
        }, 600);
    }
    // ===== S2 · order 页状态语义着色 =====
    // 状态列 = 彩点 + 文本；按行内文本匹配加 data-kc-status，CSS 语义着色
    function paintOrderStatus() {
        var rows = document.querySelectorAll('.n-data-table-tbody tr.n-data-table-tr');
        for (var i = 0; i < rows.length; i++) {
            var tds = rows[i].querySelectorAll('td.n-data-table-td');
            if (tds.length < 5) { continue; }
            var cell = tds[3];
            var txt = (cell.textContent || '').trim();
            var cls = '';
            if (/待支付/.test(txt)) { cls = 'kc-st-pending'; }
            else if (/进行中|开通中|待开通/.test(txt)) { cls = 'kc-st-doing'; }
            else if (/已完成/.test(txt)) { cls = 'kc-st-done'; }
            else if (/已取消/.test(txt)) { cls = 'kc-st-cancel'; }
            else if (/已折抵|已退款/.test(txt)) { cls = 'kc-st-refund'; }
            if (!cls) { continue; }
            rows[i].setAttribute('data-kc-status', cls);
            var dot = cell.querySelector('[class*="rounded-full"]');
            if (dot) { dot.classList.add('kc-dot'); }
        }
    }
    // ===== 注入 =====
    function mountTopbar() {
        if (document.getElementById('kc-topbar')) { return; }
        var frag = document.createElement('div');
        frag.innerHTML = HTML_TOPBAR + HTML_DRAWER;
        document.body.insertBefore(frag, document.body.firstChild);
    }
    function hideSiderLoop() {
        var tries = 0;
        var t = setInterval(function () {
            var sider = document.querySelector('aside.n-layout-sider');
            if (sider) {
                sider.style.display = 'none';
                clearInterval(t);
            } else if (++tries > 40) { clearInterval(t); }
        }, 500);
    }
    function fetchUser() {
        var token = readToken();
        if (!token) { return Promise.resolve(null); }
        return fetch('/api/v1/user/info', {
            method: 'GET',
            headers: { 'Accept': 'application/json', 'Authorization': normAuth(token) },
            credentials: 'same-origin'
        }).then(function (r) { return r.json(); }).then(function (j) {
            return (j && j.data) ? j.data : null;
        }).catch(function () { return null; });
    }
    function fillUser(u) {
        var bal = document.getElementById('kc-tb-balance');
        var dbal = document.getElementById('kc-drawer-bal');
        var email = document.getElementById('kc-tb-email');
        var avatar = document.getElementById('kc-tb-avatar');
        if (!bal || !avatar) { return; }
        if (u && typeof u.balance === 'number') {
            bal.textContent = '余额 $' + yuan(u.balance);
            if (dbal) { dbal.textContent = '$' + yuan(u.balance); }
        }
        if (u && u.email) {
            if (email) { email.textContent = u.email; }
            avatar.textContent = u.email.charAt(0).toUpperCase();
        }
        if (u && u.avatar_url) {
            avatar.style.backgroundImage = 'url(' + u.avatar_url + ')';
            avatar.style.backgroundSize = 'cover';
            avatar.textContent = '';
        }
    }
    // ===== 高亮同步 =====
    function syncActive() {
        var h = window.location.hash || '';
        var curCat = '';
        try { curCat = sessionStorage.getItem('kc_plan_cat') || ''; } catch (e) { }
        if (!curCat) { curCat = 'recharge'; }
        var links = document.querySelectorAll('#kc-topbar [data-route], #kc-drawer [data-route]');
        for (var i = 0; i < links.length; i++) {
            var a = links[i];
            // 分类页签（代充/成品号/建站服务）都指向 #/plan：按当前分类决定是否高亮
            if (a.getAttribute('data-cat')) {
                a.classList.toggle('kc-active', h.indexOf('#/plan') === 0 && a.getAttribute('data-cat') === curCat);
                continue;
            }
            var r = a.getAttribute('data-route') || '';
            if (h.indexOf(r) === 0) { a.classList.add('kc-active'); }
            else { a.classList.remove('kc-active'); }
        }
    }
    // ===== 充值 / 兑卡面板（复用 kc_panel 浮动按钮）=====
    function clickFloat(id) {
        var btn = document.getElementById(id);
        if (btn) { btn.click(); return; }
        var tries = 0;
        var timer = setInterval(function () {
            var b = document.getElementById(id);
            if (b) { clearInterval(timer); b.click(); }
            else if (++tries > 20) { clearInterval(timer); }
        }, 150);
    }
    function openTopupPanel() { clickFloat('kc-float-topup'); }
    function openRedeemPanel() { clickFloat('kc-float-redeem'); }
    // ===== 抽屉 =====
    function openDrawer() {
        var m = document.getElementById('kc-drawer-mask');
        var d = document.getElementById('kc-drawer');
        if (m) { m.classList.add('kc-show'); }
        if (d) { d.classList.add('kc-show'); }
    }
    function closeDrawer() {
        var m = document.getElementById('kc-drawer-mask');
        var d = document.getElementById('kc-drawer');
        if (m) { m.classList.remove('kc-show'); }
        if (d) { d.classList.remove('kc-show'); }
    }
    // ===== 退出登录 =====
    function doLogout() {
        try { localStorage.removeItem(TOKEN_KEY); } catch (e) { }
        window.location.href = window.location.origin + '/#/login';
        setTimeout(function () { window.location.reload(); }, 30);
    }
    // ===== 事件 =====
    // document/window 级监听只注册一次（模块顶层），teardown 重注入不会重复绑定；
    // 元素级绑定（burger/mask/close）放 bindEvents，随 DOM 重建重新挂。
    function bindEvents() {
        var burger = document.getElementById('kc-tb-burger');
        if (burger) { burger.addEventListener('click', openDrawer); }
        var mask = document.getElementById('kc-drawer-mask');
        if (mask) { mask.addEventListener('click', closeDrawer); }
        var dc = document.getElementById('kc-drawer-close');
        if (dc) { dc.addEventListener('click', closeDrawer); }
    }
    document.addEventListener('click', function (e) {
        if (!e.target || !e.target.closest) { return; }
        // data-action：充值 / 兑卡 / 退出
        var el = e.target.closest('[data-action]');
        if (el) {
            var act = el.getAttribute('data-action');
            if (act === 'topup') { closeDrawer(); openTopupPanel(); }
            else if (act === 'redeem') { closeDrawer(); openRedeemPanel(); }
            else if (act === 'logout') { closeDrawer(); doLogout(); }
            else if (act === 'guest-login') { openLoginModal(); }
            else if (act === 'go-recharge') { closeDrawer(); openRechargePage(); }
            else if (act === 'recharge-close') { closeRechargePage(); }
            else if (act === 'recharge-next') { rechargeNext(); }
            else if (act === 'recharge-pay') { rechargePay(); }
            else if (act === 'notice-close') {
                var n = document.getElementById('kc-notice');
                if (n) { n.style.display = 'none'; }
                try { sessionStorage.setItem('kc_notice_closed', '1'); } catch (err) { }
            }
        }
        // FEAT-009：商品页分类筛选 tab
        var catTab = e.target.closest('.kc-cat-tab');
        if (catTab) {
            var catVal = catTab.getAttribute('data-cat') || 'all';
            try { sessionStorage.setItem('kc_plan_cat', catVal); } catch (errC) { }
            applyCategoryFilter(catVal);
        }
        // FEAT-009：顶栏/抽屉分类页签 → 记录期望分类（链接正常跳转，无需阻止）
        var catLink = e.target.closest('#kc-topbar a[data-cat], #kc-drawer a[data-cat]');
        if (catLink) {
            var catKey = catLink.getAttribute('data-cat') || 'recharge';
            try { sessionStorage.setItem('kc_plan_cat', catKey); } catch (errL) { }
            // 已在商品页时同 hash 不会触发 hashchange → 直接应用筛选
            if (isPlanPage() && !isConfirmPage()) {
                applyCategoryFilter(catKey);
                ensurePlanCards();
                closeDrawer();
            }
            syncActive();
        }
        // R3：游客顶栏锚点滚动（hash router 环境不能用 href="#id" 锚点）
        var sc = e.target.closest('[data-scroll]');
        if (sc) {
            var t = document.getElementById(sc.getAttribute('data-scroll'));
            if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        }
        // R3：点登录弹层遮罩关闭
        if (document.body.classList.contains('kc-guest-login') &&
            e.target.classList && e.target.classList.contains('wh-full') &&
            e.target.classList.contains('items-center')) {
            closeLoginModal();
        }
        // 抽屉内路由链接点击后收起抽屉
        var drawerLink = e.target.closest('#kc-drawer a[data-route]');
        if (drawerLink) { closeDrawer(); }
        // 头像下拉 toggle（点外部关闭）
        var user = document.getElementById('kc-tb-user');
        if (user) {
            if (user.contains(e.target)) { user.classList.toggle('kc-open'); }
            else { user.classList.remove('kc-open'); }
        }
    });
    // ===== S2 · order 页着色轮询（数据异步加载 + 订单状态轮询刷新）=====
    var orderTimer = null;
    function ensureOrderPaint() {
        if (orderTimer) { clearInterval(orderTimer); orderTimer = null; }
        var tries = 0;
        orderTimer = setInterval(function () {
            if (!isOrderPage()) { clearInterval(orderTimer); orderTimer = null; return; }
            paintOrderStatus();
            releasePreApp();
            if (++tries > 15) { clearInterval(orderTimer); orderTimer = null; }
        }, 800);
    }
    window.addEventListener('hashchange', function () {
        syncActive();
        // S2: 门户显隐 + 各页增强
        syncDashboardClass();
        // 任何方式进入首页（含 SPA 跳转 / 登录后落点 #/）：门户未挂载前先压制原生内容，挂载成功自动解除
        if (isDashboard() && !document.getElementById('kc-portal')) {
            document.documentElement.classList.add('kc-pre-dash');
        }
        if (isDashboard()) { ensurePortalLoop(); }
        if (isPlanPage()) { ensurePlanCards(); }
        if (isOrderPage()) { ensureOrderPaint(); }
        // R3: 游客落地页（未登录）/ 登录后清理
        if (isLoginPage() && !readToken()) {
            if (!document.getElementById('kc-guest')) { document.documentElement.classList.add('kc-pre-guest'); }
            mountGuest(); ensureGuestLoop();
        }
        else { teardownGuest(); }
        // R5: 下单确认页余额支付提示（余额不足拦截）
        if (isConfirmPage() && readToken()) { payTip.ready = false; ensurePayTipLoop(); }
        else { removePayTip(); }
        // FEAT-007：SPA 跳转同样先压制，等目标页增强完成再解除（兜底 1.5s + 全局硬兜底）
        if (isLoginPage()) {
            document.documentElement.classList.remove('kc-pre-app');
        } else if (isPostLoginJump()) {
            // FEAT-015：登录成功后的落地跳转。此刻 Vue 刚接管、注入还没跑完，
            // 此时 armPreAppFallback() 的固定 4s 会中途解除压制 → 闪原生界面。
            // 改由 armLoginSuppress() 独占解除时机（有 token 且 booted 才解）。
            document.documentElement.classList.add('kc-pre-app');
            armLoginSuppress();
        } else {
            document.documentElement.classList.add('kc-pre-app');
            releasePreAppWhenReady();
            armPreAppFallback();
        }
        // 被踢回登录页（token 失效/退出）：摘除顶栏，等待重新登录后重注入
        var h = window.location.hash || '';
        var topbar = document.getElementById('kc-topbar');
        if (topbar && /login/.test(h)) { teardown(); }
    });
    function teardown() {
        releasePreApp();
        document.body.classList.remove('kc-card-guard');
        ['kc-topbar', 'kc-drawer', 'kc-drawer-mask', 'kc-portal'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) { el.remove(); }
        });
        document.body.classList.remove('kc-has-topbar');
        document.body.classList.remove('kc-on-dashboard');
        if (portalTimer) { clearInterval(portalTimer); portalTimer = null; }
        if (planTimer) { clearInterval(planTimer); planTimer = null; }
        if (orderTimer) { clearInterval(orderTimer); orderTimer = null; }
        booted = false;
        // FEAT-008：登录跳转后需尽快注入（原来 1.2s 间隔会让原生界面多露一段时间）
    bootTimer = setInterval(tryBoot, 300);
    }
    // ===== FEAT-017 · 全站货币符号兜底（v2：扩展全角 ￥，全页面常开） =====
    // Xboard 原生页面（邀请/工单/流量等）的金额由 umi.js 渲染，custom_html 改不到；
    // 运行时把文本节点里的「¥ / ￥」换成「$」。只改文本，不动 DOM 结构。
    // 2026-10-11：全站余额/金额一律以美元($)展示，不接受人民币符号（用户要求）。
    //
    // ⚠️ 不可用 MutationObserver({characterData:true}) —— 改文本节点会触发观察器自回调，
    //    形成死循环（实测把验收脚本卡死、页面无响应）。改为**被动低频轮询**：
    //    每 1.5s 扫一次全树，代价可忽略；没有 ¥/￥ 时立即返回，几乎不做功。
    var kcCurrencyTimer = null;
    function kcFixCurrency() {
        var scope = document.body;
        if (!scope) { return false; }
        var walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null);
        var nodes = [];
        var n;
        while ((n = walker.nextNode())) {
            if (n.nodeValue && (n.nodeValue.indexOf('¥') >= 0 || n.nodeValue.indexOf('￥') >= 0)) { nodes.push(n); }
        }
        for (var i = 0; i < nodes.length; i++) {
            nodes[i].nodeValue = nodes[i].nodeValue.split('¥').join('$').split('￥').join('$');
        }
        return nodes.length > 0;
    }
    function ensureCurrencyGuard() {
        if (kcCurrencyTimer) { return; }
        kcFixCurrency();
        kcCurrencyTimer = setInterval(function () { if (document.body) { kcFixCurrency(); } }, 1500);
    }
    // ===== 启动（轮询兜底：登录动作发生在 SPA 内、无页面刷新也能触发注入）=====
    var booted = false;
    var bootTimer = null;
    function tryBoot() {
        if (booted) { return; }
        if (!document.body) { return; }
        // 2026-10-11：货币兜底对**所有页面**常开（含游客页/登录页）——余额与金额一律以 $ 展示，不出现人民币符号
        ensureCurrencyGuard();
        if (!shouldInject()) {
            // R3：未登录 → 游客落地页（登录页挂载 + 白标替换）
            if (isLoginPage()) {
                if (!document.getElementById('kc-guest')) { document.documentElement.classList.add('kc-pre-guest'); }
                mountGuest(); ensureGuestLoop();
            } else if (readToken()) {
                // FEAT-008/014：token 已出现但注入尚未完成（刚登录跳转）→ 先压制，等注入完成再解除
                if (!document.documentElement.classList.contains('kc-pre-app')) {
                    document.documentElement.classList.add('kc-pre-app');
                    armLoginSuppress();
                }
            }
            return;
        }
        booted = true;
        if (bootTimer) { clearInterval(bootTimer); bootTimer = null; }
        kcSuppressRelease = false;   // FEAT-015：注入完成，解除登录窗口对压制的独占
        unmarkLoginSuppress();
        teardownGuest();
        detectDark();
        document.body.classList.add('kc-has-topbar');
        // FEAT-007：商品卡片守卫——未改造完成的原生卡片保持隐藏（防止跳转/重渲染时露出原生卡片）
        document.body.classList.add('kc-card-guard');
        document.body.classList.toggle('kc-dark', IS_DARK);
        ensureCurrencyGuard();
        mountTopbar();
        setupNavCategories();
        bindEvents();
        hideSiderLoop();
        fetchUser().then(fillUser);
        syncActive();
        // S2: 门户 / plan 角标 / order 着色（按当前路由驱动）
        syncDashboardClass();
        if (isDashboard()) { ensurePortalLoop(); }
        if (isPlanPage()) { ensurePlanCards(); }
        if (isConfirmPage() && readToken()) { ensurePayTipLoop(); }
        if (isOrderPage()) { ensureOrderPaint(); }
        // FEAT-007：通用压制解除时机——dashboard/plan/order 由各自增强完成时解除，
        // 其余会员页按「增强就绪」检查后解除（含硬超时兜底）
        releasePreAppWhenReady();
        armPreAppFallback();
    }
    // FEAT-008：登录跳转后需尽快注入（原来 1.2s 间隔会让原生界面多露一段时间）
    bootTimer = setInterval(tryBoot, 300);
    // FEAT-015 安全阀：无论何种路径，20s 后强制解锁 + 解除压制（绝不永久白屏）
    setTimeout(function () { kcSuppressRelease = false; unmarkLoginSuppress(); releasePreApp(true); }, 20000);
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { setTimeout(tryBoot, 500); });
    } else {
        setTimeout(tryBoot, 500);
    }
    // 晚期兜底（等 Vue mount + token 就绪）
    setTimeout(tryBoot, 1500);
    setTimeout(tryBoot, 4000);
})();
</script>
