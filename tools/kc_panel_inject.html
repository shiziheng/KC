<!-- ===================================================================
     KC 代充集成 · 全站浮动面板（FEAT-004 · D1 兑卡 + D3 充值）
     -------------------------------------------------------------------
     注入位置：custom_html（与 kc_activate_inject.html 拼接后写入）
     组成：
       1. 右下角浮动按钮组：「充值」「兑换卡密」（全站常驻）
       2. 兑卡面板（无需登录）：CDK → ChatGPT Session → 自动开通 → 进度
       3. 充值面板（需登录）：档位/自由金额 → 支付方式 → 下单支付 → 到账
       4. 订单页增强：充值订单显示「已充值 $X 到余额」
     接口：
       兑卡   POST /kc/redeem/verify | /kc/redeem/start | GET /kc/redeem/status
       充值   POST /user/kc/topup/prepare | GET /user/kc/topup/info（登录）
       原生   GET /api/v1/user/order/getPaymentMethod
              POST /api/v1/user/order/save | /checkout | GET /check（登录）
     =================================================================== -->
<script>
(function () {
    'use strict';

    if (window.__kcPanelLoaded) { return; }
    window.__kcPanelLoaded = true;

    // ===== 配置 =====
    var TOKEN_KEY = 'VUE_NAIVE_ACCESS_TOKEN';
    var PRESET_AMOUNTS = [100, 300, 500];       // 预设档位（美元）
    var MIN_USD = 1, MAX_USD = 500;             // 自由输入范围（美元）
    var POLL_PAY_MS = 3000, POLL_PAY_MAX = 40;   // 支付结果轮询
    var POLL_TASK_MS = 3000, POLL_TASK_MAX = 200;// 开通进度轮询

    // ===== 通用工具 =====
    function readToken() {
        try {
            var raw = localStorage.getItem(TOKEN_KEY);
            if (!raw) { return ''; }
            var obj = JSON.parse(raw);
            if (obj && obj.value) { return String(obj.value); }
            return typeof obj === 'string' ? obj : '';
        } catch (e) { return ''; }
    }

    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    var IS_DARK = false;
    function detectDark() {
        try {
            var bg = getComputedStyle(document.body).backgroundColor || '';
            var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(bg);
            if (m) { IS_DARK = (0.299 * +m[1] + 0.587 * +m[2] + 0.114 * +m[3]) < 128; }
        } catch (e) { }
    }

    function theme() {
        return IS_DARK
            ? { bg: '#1c1c1f', border: '#2f2f33', title: '#f2f2f3', text: '#c9c9cc', sub: '#8a8a92',
                field: '#242428', hover: '#2a2a30', ok: '#18a058', warn: '#f0a020', err: '#d03050', mask: 'rgba(0,0,0,.55)' }
            : { bg: '#ffffff', border: '#efeff5', title: '#1f1f23', text: '#4a4a52', sub: '#8a8a92',
                field: '#f7f7fa', hover: '#f0f0f4', ok: '#18a058', warn: '#f0a020', err: '#d03050', mask: 'rgba(0,0,0,.35)' };
    }

    /**
     * 统一 API 封装。
     * 插件接口信封 {status:'success', data} ；原生接口信封 {data} / {message}；
     * checkout 特例：直接 {type, data}（无信封），用 hasType 识别。
     */
    function api(method, url, body, opt) {
        opt = opt || {};
        var headers = { 'Accept': 'application/json' };
        if (body !== undefined && !(body instanceof FormData)) {
            headers['Content-Type'] = 'application/json';
        }
        var token = readToken();
        if (token) { headers['Authorization'] = 'Bearer ' + token; }
        if (opt.noAuth) { delete headers['Authorization']; }

        return fetch(url, {
            method: method,
            headers: headers,
            credentials: 'same-origin',
            body: body === undefined ? undefined : JSON.stringify(body)
        }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) {
                if (opt.hasType && j && typeof j.type !== 'undefined') {
                    return { ok: true, type: j.type, data: j.data };
                }
                if (r.ok && j && (j.status === 'success' || (typeof j.data !== 'undefined' && !j.message))) {
                    return { ok: true, data: j.data === undefined ? j : j.data };
                }
                return { ok: false, error: (j && j.message) ? String(j.message) : ('请求失败(HTTP ' + r.status + ')') };
            });
        }).catch(function (e) {
            return { ok: false, error: '网络异常，请稍后重试' };
        });
    }

    function yuan(fen) { return (fen / 100).toFixed(fen % 100 === 0 ? 0 : 2); }

    // ================================================================
    // 面板骨架
    // ================================================================
    var panelHost = null;

    function ensureHost() {
        if (panelHost && document.body.contains(panelHost)) { return panelHost; }
        detectDark();
        var t = theme();
        panelHost = document.createElement('div');
        panelHost.id = 'kc-panel-host';
        panelHost.style.cssText = 'position:fixed;inset:0;display:none;z-index:99999;';
        panelHost.innerHTML =
            '<div id="kc-panel-mask" style="position:absolute;inset:0;background:' + t.mask + ';"></div>' +
            '<div id="kc-panel-box" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);max-height:86vh;overflow:auto;background:' + t.bg + ';border:1px solid ' + t.border + ';border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);font-family:inherit;box-sizing:border-box;">' +
              '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0 20px;">' +
                '<span id="kc-panel-title" style="font-size:16px;font-weight:600;color:' + t.title + ';"></span>' +
                '<button id="kc-panel-close" type="button" style="border:0;background:transparent;color:' + t.sub + ';font-size:20px;line-height:1;cursor:pointer;padding:4px;">×</button>' +
              '</div>' +
              '<div id="kc-panel-body" style="padding:16px 20px 20px 20px;"></div>' +
            '</div>';
        document.body.appendChild(panelHost);

        panelHost.querySelector('#kc-panel-mask').addEventListener('click', closePanel);
        panelHost.querySelector('#kc-panel-close').addEventListener('click', closePanel);
        return panelHost;
    }

    function openPanel(title) {
        ensureHost();
        panelHost.style.display = 'block';
        panelHost.querySelector('#kc-panel-title').textContent = title;
        setBody('');
    }

    // ===== v1.27.0 UX 第一批 ======
    // P0-3：订单列表金额修正。余额支付订单 total_amount=0、真实金额在 balance_amount，
    //       原生列表只取 total_amount → 全部显示 0.00。这里嗅探接口响应拿真值后回填。
    var KC_ORD = {};
    function kcAbsorb(j) {
        try {
            var seen = 0;
            (function walk(o, d) {
                if (!o || d > 6 || seen > 4000) { return; }
                if (Array.isArray(o)) { for (var i = 0; i < o.length; i++) { walk(o[i], d + 1); } return; }
                if (typeof o !== 'object') { return; }
                if (typeof o.trade_no === 'string' && o.trade_no) {
                    KC_ORD[o.trade_no] = { t: Number(o.total_amount || 0), b: Number(o.balance_amount || 0) };
                    seen++;
                }
                for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) { walk(o[k], d + 1); } }
            })(j, 0);
        } catch (e) { }
    }
    function kcSniffJson(text) {
        try { if (text && text.charAt(0) === '{') { kcAbsorb(JSON.parse(text)); } } catch (e) { }
    }
    function kcInstallSniffer() {
        if (window.__kcSniffed) { return; }
        window.__kcSniffed = 1;
        try {
            var _f = window.fetch;
            if (typeof _f === 'function') {
                window.fetch = function () {
                    var p = _f.apply(this, arguments);
                    try {
                        p.then(function (r) {
                            try { if (r && r.clone) { r.clone().text().then(kcSniffJson); } } catch (e) { }
                            return r;
                        });
                    } catch (e) { }
                    return p;
                };
            }
            var _o = XMLHttpRequest.prototype.open, _s = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function (m, u) { this.__kcUrl = String(u || ''); return _o.apply(this, arguments); };
            XMLHttpRequest.prototype.send = function () {
                var self = this;
                try {
                    this.addEventListener('readystatechange', function () {
                        if (self.readyState === 4) { try { kcSniffJson(self.responseText); } catch (e) { } }
                    });
                } catch (e) { }
                return _s.apply(this, arguments);
            };
        } catch (e) { }
    }
    function kcFmtUsd(cents) { return '$' + (Number(cents || 0) / 100).toFixed(2); }
    function kcPatchOrderList() {
        try { window.kcOrderPatchRan = (window.kcOrderPatchRan || 0) + 1; } catch (e) { }
        if (!/order/i.test(window.location.hash || '')) { return; }
        var rows = document.querySelectorAll('tbody tr');
        for (var i = 0; i < rows.length; i++) {
            var tr = rows[i];
            var txt = tr.textContent || '';
            // P0-4：已完成/已取消/已关闭 不再显示「取消」
            if (/已完成|已取消|已关闭/.test(txt)) {
                var acts = tr.querySelectorAll('a,button');
                for (var a = 0; a < acts.length; a++) {
                    if (/取消/.test(acts[a].textContent || '')) { acts[a].style.display = 'none'; }
                }
            }
            // P0-3：金额回填
            if (tr.getAttribute('data-kc-amt')) { continue; }
            var no = '';
            for (var k in KC_ORD) { if (Object.prototype.hasOwnProperty.call(KC_ORD, k) && txt.indexOf(k) >= 0) { no = k; break; } }
            if (!no) { continue; }
            var o = KC_ORD[no];
            var amount = o.t > 0 ? o.t : o.b;
            if (amount <= 0) { continue; }
            var tds = tr.querySelectorAll('td');
            for (var c = 0; c < tds.length; c++) {
                var cell = (tds[c].textContent || '').trim();
                if (/^0\.00$|^¥0\.00$|^\$0\.00$|^0$/.test(cell)) {
                    tds[c].innerHTML = '<b>' + kcFmtUsd(amount) + '</b>' +
                        '<div style="font-size:11px;opacity:.65;margin-top:2px;">' + (o.t > 0 ? 'USDT 支付' : '余额支付') + '</div>';
                    tr.setAttribute('data-kc-amt', '1');
                    break;
                }
            }
        }
    }

    // ===== P0-3b：订单【详情页】原生渲染的裸金额补 $（余额支付行显示 15.00 → $15.00）=====
    function kcPatchDetail() {
        try { window.kcDetailRan = (window.kcDetailRan || 0) + 1; } catch (e) { }
        if (!/order\/[A-Za-z0-9]/.test(window.location.hash || '')) { return; }
        try {
            var cards = document.querySelectorAll('.n-card');
            for (var i = 0; i < cards.length; i++) {
                var head = cards[i].querySelector('.n-card-header__main');
                if (!head || (head.textContent || '').trim() !== '订单信息') { continue; }
                var rows = cards[i].querySelectorAll('.n-card__content > .flex');
                for (var r = 0; r < rows.length; r++) {
                    var lab = rows[r].firstElementChild ? (rows[r].firstElementChild.textContent || '').trim() : '';
                    var valEl = rows[r].lastElementChild;
                    if (!valEl || valEl === rows[r].firstElementChild) { continue; }
                    if (/订单号|创建时间|时间/.test(lab)) { continue; }
                    var v = (valEl.textContent || '').trim();
                    if (/^\d+(\.\d{1,2})?$/.test(v)) { valEl.textContent = '$' + Number(v).toFixed(2); }
                }
            }
        } catch (e) { }
        // ===== P0-5b：顶部原生副标题与真实开通状态联动，消除「已支付并开通」vs「待开通」矛盾 =====
        try {
            var badge = document.getElementById('kc-status-text');
            var st = badge ? (badge.textContent || '').trim() : '';
            var map = {
                '待开通': '订单已支付，卡密已发放，待完成开通。',
                '开通中': '订单已支付，正在为你开通…',
                '已完成': '订单已支付并已开通。',
                '开通失败': '订单已支付，开通失败，可联系客服。'
            };
            var want = map[st];
            if (want) {
                var known = {};
                for (var kk in map) { if (Object.prototype.hasOwnProperty.call(map, kk)) { known[map[kk]] = 1; } }
                known['订单已支付并开通。'] = 1;
                var all = document.querySelectorAll('div,span,p');
                for (var j = 0; j < all.length; j++) {
                    var e = all[j];
                    if (e.childElementCount !== 0) { continue; }
                    var tx = (e.textContent || '').trim();
                    if (known[tx]) { if (tx !== want) { e.textContent = want; } break; }
                }
            }
        } catch (e) { }
    }

    // 注：原「有生效订阅仍可充值」提示按产品要求（2026-10-13）移除——充值页不再出现订阅相关提示。

    function kcScheduleOrderPatch() {
        [250, 800, 1800, 3500].forEach(function (d) { setTimeout(function () { kcPatchOrderList(); kcPatchDetail(); }, d); });
    }
    // 定时点会早于 Vue 渲染（详情卡是异步取数后渲染）→ 用 Observer 持续兜底（防抖 250ms）。
    // 幂等性保证：金额列改后不再匹配裸数字；副标题改后等于目标值即不再写。
    function kcStartOrderObserver() {
        if (window.__kcOrderObs) { return; }
        window.__kcOrderObs = 1;
        try {
            var pend = null;
            var mo = new MutationObserver(function () {
                if (!/order/i.test(window.location.hash || '')) { return; }
                if (pend) { return; }
                pend = setTimeout(function () {
                    pend = null;
                    try { kcPatchOrderList(); } catch (e) { }
                    try { kcPatchDetail(); } catch (e) { }
                }, 250);
            });
            mo.observe(document.body, { childList: true, subtree: true });
        } catch (e) { }
    }
    kcStartOrderObserver();
    kcInstallSniffer();
    try { window.kcPatchOrderList = kcPatchOrderList; window.kcPatchDetail = kcPatchDetail; window.kcScheduleOrderPatch = kcScheduleOrderPatch; } catch (e) { }
function closePanel() {
        stopAllPolls();
        if (panelHost) { panelHost.style.display = 'none'; }
    }

    function setBody(html) {
        var b = panelHost.querySelector('#kc-panel-body');
        b.innerHTML = html;
        return b;
    }

    function setTitle(s) {
        if (panelHost) { panelHost.querySelector('#kc-panel-title').textContent = s; }
    }

    function showErr(container, msg) {
        var t = theme();
        var el = container.querySelector('#kc-panel-err');
        if (!el) {
            el = document.createElement('div');
            el.id = 'kc-panel-err';
            el.style.cssText = 'margin-top:10px;font-size:13px;color:' + t.err + ';line-height:1.6;';
            container.appendChild(el);
        }
        el.textContent = msg || '';
        el.style.display = msg ? 'block' : 'none';
    }

    // ================================================================
    // 浮动按钮组
    // ================================================================
    function buildFloatButtons() {
        if (document.getElementById('kc-float-btns')) { return; }
        var wrap = document.createElement('div');
        wrap.id = 'kc-float-btns';
        wrap.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:99998;display:flex;flex-direction:column;gap:10px;';
        // FEAT-010：代充向导打开时隐藏悬浮按钮组（z-index 99998 会遮挡向导底部操作栏）
        if (!document.getElementById('kc-float-style')) {
            var _st = document.createElement('style');
            _st.id = 'kc-float-style';
            _st.textContent = 'body.kc-guide-open #kc-float-btns{display:none !important;}' +
                '@media (max-width: 520px){#kc-float-btns{right:10px;bottom:10px;gap:8px;}' +
                '#kc-float-btns button{padding:8px 14px;font-size:13px;}}';
            document.head.appendChild(_st);
        }
        var mk = function (id, label, bg) {
            var b = document.createElement('button');
            b.id = id;
            b.type = 'button';
            b.textContent = label;
            b.style.cssText = 'padding:10px 18px;border:0;border-radius:22px;background:' + bg + ';color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22);';
            return b;
        };
        wrap.appendChild(mk('kc-float-topup', '充值', '#18a058'));
        wrap.appendChild(mk('kc-float-redeem', '兑换卡密', '#2080f0'));
        document.body.appendChild(wrap);

        wrap.querySelector('#kc-float-redeem').addEventListener('click', openRedeem);
        wrap.querySelector('#kc-float-topup').addEventListener('click', openTopup);
    }

    // ================================================================
    // 充值面板（D3）
    // ================================================================
    var payPollTimer = null;

    function stopAllPolls() {
        if (payPollTimer) { clearInterval(payPollTimer); payPollTimer = null; }
        if (taskPollTimer) { clearInterval(taskPollTimer); taskPollTimer = null; }
    }

    function openTopup() {
        openPanel('余额充值');
        var t = theme();
        var token = readToken();

        if (!token) {
            var b = setBody(
                '<div style="font-size:14px;color:' + t.text + ';line-height:2;">充值需要先登录账号。</div>'
            );
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = '去登录';
            btn.style.cssText = 'margin-top:12px;padding:10px 28px;border:0;border-radius:8px;background:' + t.ok + ';color:#fff;font-size:14px;font-weight:600;cursor:pointer;';
            btn.addEventListener('click', function () {
                closePanel();
                try { window.location.hash = '#/login'; } catch (e) { }
            });
            b.appendChild(btn);
            return;
        }

        // v1.27.0（UX 第一批·P0-1）：删除「有有效订阅不可充值余额」拦截。
        // 余额只能站内消费、不存在套利空间；拦截让有订阅的客户根本充不了钱（收入流失），
        // 且与「余额优先支付」的下单逻辑自相矛盾。后端 prepare 也无此限制（仅金额边界+频控）。
        // ⚠️ 只能调同块（块#2）内函数：openRechargePage 在块#3，跨块会 ReferenceError。
        renderAmountStep();
    }

        // ================================================================
    // FEAT-014 · 充值订单台账（前台）
    // ================================================================
    var KC_TOPUP_STATUS = {
        pending: { label: '待支付', color: '#BA7517' },
        overdue: { label: '已失效', color: '#888780' },
        done: { label: '已到账', color: '#639922' },
        failed: { label: '处理失败', color: '#A32D2D' }
    };

    function kcFmtTime(ts) {
        if (!ts) { return '—'; }
        var d = new Date(ts * 1000);
        var p = function (n) { return n < 10 ? ('0' + n) : String(n); };
        return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function renderTopupOrders() {
        var t = theme();
        setTitle('充值记录');
        var b = setBody('<div id="kc-tp-orders" style="font-size:13px;color:' + t.sub + ';">加载中…</div>');
        api('GET', '/user/kc/topup/orders').then(function (res) {
            var host = b.querySelector('#kc-tp-orders');
            if (!host) { return; }
            if (!res || !res.ok) {
                host.innerHTML = '<div style="color:' + t.err + ';">充值记录加载失败，请稍后重试</div>';
                return;
            }
            var groups = (res.data && res.data.groups) || {};
            var all = (res.data && res.data.orders) || [];
            var ttl = (res.data && res.data.ttl) || 1800;
            if (!all.length) {
                host.innerHTML = '<div style="text-align:center;padding:26px 0;color:' + t.sub + ';">还没有充值记录</div>';
                appendBackBtn(b, renderAmountStep, t);
                return;
            }
            // 顺序：待支付 → 已失效 → 已到账 → 处理失败（同状态内按时间倒序，接口已排好）
            var order = ['pending', 'overdue', 'done', 'failed'];
            var titles = { pending: '待支付', overdue: '已失效', done: '已到账', failed: '处理失败' };
            var html = '<div style="font-size:12px;color:' + t.sub + ';margin-bottom:10px;">充值订单有效期 ' + Math.round(ttl / 60) + ' 分钟，超时未付自动失效，不影响重新发起。</div>';
            order.forEach(function (k) {
                var list = groups[k] || [];
                if (!list.length) { return; }
                var meta = KC_TOPUP_STATUS[k] || { label: k, color: t.sub };
                html += '<div style="margin:14px 0 6px;font-size:13px;font-weight:600;color:' + t.title + ';">' +
                    titles[k] + ' <span style="font-weight:400;color:' + t.sub + ';">(' + list.length + ')</span></div>';
                list.forEach(function (o) {
                    var left = 0;
                    if (k === 'pending' && o.expires_at) { left = Math.max(0, o.expires_at - Math.floor(Date.now() / 1000)); }
                    var leftTxt = k === 'pending'
                        ? (left > 0 ? ('剩余 ' + Math.floor(left / 60) + ' 分 ' + (left % 60) + ' 秒') : '即将失效')
                        : '';
                    html += '<div style="border:1px solid ' + t.border + ';border-radius:8px;padding:10px 12px;margin-bottom:8px;background:' + t.field + ';">' +
                        '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">' +
                        '<b style="font-size:14px;color:' + t.title + ';">$' + ((o.amount || 0) / 100).toFixed(2) + '</b>' +
                        '<span style="font-size:12px;font-weight:600;color:' + meta.color + ';">' + meta.label + '</span>' +
                        '</div>' +
                        '<div style="font-size:11.5px;color:' + t.sub + ';margin-top:5px;line-height:1.7;">' +
                        '订单 <span style="font-family:monospace;">' + String(o.trade_no).slice(-12) + '</span><br>' +
                        '发起 ' + kcFmtTime(o.created_at) +
                        (o.paid_at ? (' · 到账 ' + kcFmtTime(o.paid_at)) : '') +
                        (leftTxt ? (' · <span style="color:' + meta.color + ';">' + leftTxt + '</span>') : '') +
                        (o.error_msg ? ('<br><span style="color:' + t.err + ';">' + o.error_msg + '</span>') : '') +
                        '</div></div>';
                });
            });
            host.innerHTML = html;

    function renderPayStep(amountFen) {
        var t = theme();
        setTitle('余额充值 · 支付方式');
        var b = setBody('<div style="font-size:14px;color:' + t.sub + ';">正在加载支付方式…</div>');

        api('GET', '/api/v1/user/order/getPaymentMethod', undefined).then(function (res) {
            if (!res.ok) { b.innerHTML = ''; showErr(b, res.error); return; }
            var methods = (res.data && res.data.data) ? res.data.data : (Array.isArray(res.data) ? res.data : []);
            // 兼容两种信封：{data:[...]} 与直接 [...]
            if (res.data && Array.isArray(res.data)) { methods = res.data; }
            if (!methods.length) {
                b.innerHTML = '<div style="font-size:14px;color:' + t.text + ';line-height:2;">本站暂未配置在线支付渠道，请联系管理员。</div>';
                return;
            }
            var listHtml = methods.map(function (m, i) {
                var fee = '';
                if ((m.handling_fee_fixed && +m.handling_fee_fixed > 0) || (m.handling_fee_percent && +m.handling_fee_percent > 0)) {
                    fee = '<span style="font-size:12px;color:' + t.warn + ';">（含手续费）</span>';
                }
                return '<label class="kc-pay-item" data-i="' + i + '" style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid ' + t.border + ';background:' + t.field + ';border-radius:8px;cursor:pointer;margin-bottom:8px;">' +
                    '<input type="radio" name="kc-pay" data-id="' + m.id + '" ' + (i === 0 ? 'checked' : '') + ' style="accent-color:' + t.ok + ';"/>' +
                    '<span style="flex:1;font-size:14px;color:' + t.title + ';">' + esc(m.name || ('渠道 #' + m.id)) + '</span>' + fee +
                  '</label>';
            }).join('');

            b.innerHTML =
                '<div style="font-size:14px;color:' + t.text + ';margin-bottom:12px;">充值金额：<b style="color:' + t.title + ';font-size:16px;">$' + yuan(amountFen) + '</b></div>' +
                listHtml +
                '<button id="kc-topup-pay" type="button" style="margin-top:8px;width:100%;padding:12px 0;border:0;border-radius:8px;background:' + t.ok + ';color:#fff;font-size:15px;font-weight:600;cursor:pointer;">确认支付 $' + yuan(amountFen) + '</button>';

            var chosen = methods[0] ? methods[0].id : null;
            Array.prototype.forEach.call(b.querySelectorAll('input[name="kc-pay"]'), function (r) {
                r.addEventListener('change', function () { chosen = parseInt(r.getAttribute('data-id'), 10); });

    function createAndPay(amountFen, methodId, container, payBtn) {
        // ① prepare：金额 → 一次性充值套餐
        api('POST', '/user/kc/topup/prepare', { amount: amountFen }).then(function (r1) {
            if (!r1.ok) { resetPayBtn(payBtn); showErr(container, r1.error); return; }
            var planId = r1.data && r1.data.plan_id;
            if (!planId) { resetPayBtn(payBtn); showErr(container, '套餐准备失败'); return; }

            // ② save：原生下单（⚠️ FormRequest 白名单是旧版键 onetime_price，
            //    传 'onetime' 会被「套餐周期参数有误」拒绝）
            api('POST', '/api/v1/user/order/save', { plan_id: planId, period: 'onetime_price' }).then(function (r2) {
                if (!r2.ok) { resetPayBtn(payBtn); showErr(container, r2.error); return; }
                var tradeNo = (r2.data && r2.data.data) ? r2.data.data : r2.data;
                if (!tradeNo || typeof tradeNo !== 'string') { resetPayBtn(payBtn); showErr(container, '订单创建失败'); return; }

                // ③ checkout：拉起支付
                api('POST', '/api/v1/user/order/checkout', { trade_no: tradeNo, method: methodId }, { hasType: true }).then(function (r3) {
                    if (!r3.ok) { resetPayBtn(payBtn); showErr(container, r3.error); return; }
                    if (r3.type === -1) { pollPayResult(tradeNo, container, 0); return; }   // 0 元单直接进轮询
                    var payData = r3.data;
                    // type=0：URL 跳转；type=1：二维码/内容展示 —— 但 data 为 http(s) 链接时
                    // （如 BEpusdt 收银台 URL）同样自动新窗打开，用户才能看到支付页
                    if (typeof payData === 'string' && (r3.type === 0 || /^https?:\/\//i.test(payData))) {
                        try { window.open(payData, '_blank', 'noopener'); } catch (e) { window.location.href = payData; }
                    }
                    renderWaitingStep(tradeNo, amountFen, container, payData);
                });
            });
        });
    }

    function resetPayBtn(btn) {
        btn.disabled = false; btn.style.opacity = '1'; btn.textContent = btn.textContent.replace('创建订单中…', '确认支付');
    }

    function renderWaitingStep(tradeNo, amountFen, container, payData) {
        var t = theme();
        setTitle('余额充值 · 等待支付');
        var qrHtml = '';
        if (payData && typeof payData === 'string' && payData.length < 300) {
            qrHtml = '<div style="margin-top:10px;font-size:12px;color:' + t.sub + ';word-break:break-all;">支付内容：' + esc(payData) + '</div>';
        }
        container.innerHTML =
            '<div style="font-size:14px;color:' + t.text + ';line-height:2;">' +
              '订单号：<code style="font-size:12px;color:' + t.title + ';">' + esc(tradeNo) + '</code><br/>' +
              '应付：<b style="color:' + t.title + ';font-size:16px;">$' + yuan(amountFen) + '</b><br/>' +
              '<span id="kc-pay-wait">等待支付结果，完成后本页自动更新…</span>' +
            '</div>' + qrHtml +
            '<button id="kc-pay-done-manual" type="button" style="margin-top:14px;width:100%;padding:10px 0;border:1px solid ' + t.border + ';background:transparent;color:' + t.text + ';border-radius:8px;font-size:13px;cursor:pointer;">我已完成支付，手动刷新</button>';

        container.querySelector('#kc-pay-done-manual').addEventListener('click', function () {
            pollOncePay(tradeNo, container);
        });
        startPayPoll(tradeNo, container);
    }

    function startPayPoll(tradeNo, container) {
        stopPayPoll();
        var n = 0;
        payPollTimer = setInterval(function () {
            if (++n > POLL_PAY_MAX) { stopPayPoll(); return; }
            pollOncePay(tradeNo, container);
        }, POLL_PAY_MS);
    }

    function stopPayPoll() {
        if (payPollTimer) { clearInterval(payPollTimer); payPollTimer = null; }
    }

    function pollOncePay(tradeNo, container) {
        api('GET', '/api/v1/user/order/check?trade_no=' + encodeURIComponent(tradeNo), undefined).then(function (res) {
            if (!res.ok) { return; }
            var st = (res.data && typeof res.data.data !== 'undefined') ? res.data.data : res.data;
            if (+st === 3) {
                stopPayPoll();
                // 到账确认：查充值记录（加钱由支付回调钩子完成，可能有 1~2 秒延迟）
                api('GET', '/user/kc/topup/info?trade_no=' + encodeURIComponent(tradeNo), undefined).then(function (r2) {
                    var amount = (r2.ok && r2.data && r2.data.amount) ? r2.data.amount : 0;
                    var after = (r2.ok && r2.data && r2.data.balance_after) ? r2.data.balance_after : 0;
                    renderTopupDone(container, amount, after);
                });
            } else if (+st === 2) {
                stopPayPoll();
                var t = theme();
                container.innerHTML = '<div style="font-size:14px;color:' + t.err + ';line-height:2;">订单已取消。如已付款请联系客服处理。</div>';
            }
        });
    }

    function renderTopupDone(container, amountFen, balanceAfter) {
        var t = theme();

        var extra = balanceAfter ? ('，当前余额 $' + yuan(balanceAfter)) : '';
        container.innerHTML =
            '<div style="text-align:center;padding:12px 0;">' +
              '<div style="font-size:40px;line-height:1;">✅</div>' +
              '<div style="margin-top:12px;font-size:16px;font-weight:600;color:' + t.title + ';">充值成功</div>' +
              '<div style="margin-top:8px;font-size:14px;color:' + t.text + ';">' +
                (amountFen ? ('$' + yuan(amountFen) + ' 已到账余额' + extra + '。') : '余额已到账。') +
              '</div>' +
              '<button id="kc-topup-close2" type="button" style="margin-top:16px;padding:10px 32px;border:0;border-radius:8px;background:' + t.ok + ';color:#fff;font-size:14px;font-weight:600;cursor:pointer;">好的</button>' +

    }

            '<button id="kc-cdk-verify" type="button" style="margin-top:14px;width:100%;padding:12px 0;border:0;border-radius:8px;background:#2080f0;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">验 证</button>'

                if ((d.status === 'processing' || d.job_key) && d.status !== 'pending') {

                    return;

    function renderSessionStep() {
        var t = theme();
        setTitle('兑换卡密 · 提供 ChatGPT 凭据');
        var b = setBody(
            '<div style="font-size:13px;color:' + t.text + ';line-height:1.9;margin-bottom:12px;">' +
              '卡密验证通过' + (taskState.label ? ('：<b style="color:' + t.title + ';">' + esc(taskState.label) + '</b>') : '') + '。<br/>' +

            '</div>' +
            '<div style="font-size:12px;color:' + t.sub + ';line-height:1.8;background:' + t.field + ';border-radius:8px;padding:10px 12px;margin-bottom:12px;">' +
              '获取方式：浏览器登录 <b>chatgpt.com</b> → 新标签打开 <b>chatgpt.com/api/auth/session</b> → ' +

            '</div>' +
            '<textarea id="kc-session-input" rows="4" maxlength="20000" placeholder="粘贴 Session Token（仅用于本次开通，不落库、不记录）" ' +

            '<button id="kc-session-start" type="button" style="margin-top:12px;width:100%;padding:12px 0;border:0;border-radius:8px;background:' + t.ok + ';color:#fff;font-size:15px;font-weight:600;cursor:pointer;">开始开通</button>'
        );

        b.querySelector('#kc-session-start').addEventListener('click', function () {
            var session = (b.querySelector('#kc-session-input').value || '').trim();
            if (session.length < 20) { showErr(b, 'Session Token 看起来不完整，请重新复制粘贴'); return; }
            showErr(b, '');
            var btn = this;
            btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = '提交中…';
            api('POST', '/kc/redeem/start', { cdk: taskState.cdk, session: session }, { noAuth: true }).then(function (res) {
                if (!res.ok) {
                    btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '开始开通';
                    showErr(b, res.error);
                    return;
                }

    function renderTaskPoll() {
        var t = theme();
        setTitle('兑换卡密 · 开通进度');
        var b = setBody(
            '<div style="height:6px;background:' + t.field + ';border-radius:3px;overflow:hidden;margin-bottom:14px;">' +
              '<div id="kc-task-bar" style="height:100%;width:5%;background:#2080f0;transition:width .5s ease;"></div>' +
            '</div>' +
            '<div id="kc-task-msg" style="font-size:14px;color:' + t.text + ';line-height:1.9;">正在连接开通服务…</div>' +
            '<div style="margin-top:14px;font-size:12px;color:' + t.sub + ';line-height:1.8;">开通期间请勿关闭本页面。预计 3~10 分钟完成，完成后此页面自动更新。</div>'
        );

        var n = 0;
        var poll = function () {
            api('GET', '/kc/redeem/status?cdk=' + encodeURIComponent(taskState.cdk), undefined, { noAuth: true }).then(function (res) {
                if (!res.ok) { return; }
                var d = res.data || {};
                var msgEl = b.querySelector('#kc-task-msg');
                var bar = b.querySelector('#kc-task-bar');
                if (!msgEl) { return; }

                var prog = (typeof d.progress === 'number') ? d.progress : null;
                var status = String(d.task_status || '').toLowerCase();
                var text = String(d.message || d.status_cn || '');

                if (status === 'completed' || prog === 100) {
                    stopAllPolls();
                    bar.style.width = '100%'; bar.style.background = t.ok;
                    msgEl.innerHTML = '<b style="color:' + t.ok + ';font-size:15px;">🎉 开通完成！</b><br/>' +
                        '订阅已打在你提供的 ChatGPT 账号上，重新登录 ChatGPT 即可看到新订阅。';
                    return;
                }
                if (status === 'failed') {
                    stopAllPolls();
                    bar.style.width = '100%'; bar.style.background = t.err;
                    msgEl.innerHTML = '<b style="color:' + t.err + ';font-size:15px;">开通失败</b><br/>' +
                        esc(text || '详情请联系客服。') +
                        ' <a href="javascript:void(0)" id="kc-task-retry" style="color:#2080f0;text-decoration:none;">重新提交</a>';
                    var retry = b.querySelector('#kc-task-retry');
                    if (retry) { retry.addEventListener('click', function () { openRedeem(); }); }
                    return;
                }
                // 进行中
                var width = (prog && prog > 0) ? Math.max(5, Math.min(99, prog)) : Math.min(95, 5 + n * 2);
                bar.style.width = width + '%';
                msgEl.textContent = text || ('开通中…（' + width + '%）');
                if (++n > POLL_TASK_MAX) { stopAllPolls(); }
            });
        };

        poll();
        stopAllPolls();
        taskPollTimer = setInterval(poll, POLL_TASK_MS);
    }

    // ================================================================
    // 订单页增强（D3）：充值订单显示「已充值 $X 到余额」
    // ================================================================
    var ORDER_RE = /^#\/order\/([A-Za-z0-9_-]+)$/;
    var TOPUP_CARD_ID = 'kc-topup-result-card';
    var topupInflight = false;

    function orderTradeNo() {
        var m = ORDER_RE.exec(window.location.hash || '');
        return m ? m[1] : '';
    }

    function injectTopupCard() {
        try {
            var tn = orderTradeNo();
            if (!tn) {
                var old = document.getElementById(TOPUP_CARD_ID);
                if (old && old.parentNode) { old.parentNode.removeChild(old); }
                return;
            }
            if (topupInflight) { return; }
            var exist = document.getElementById(TOPUP_CARD_ID);
            if (exist && exist.getAttribute('data-trade-no') === tn) { return; }
            if (exist && exist.parentNode) { exist.parentNode.removeChild(exist); }

            var token = readToken();
            if (!token) { return; }
            var host = document.querySelector('section.flex-1 > section > div.flex.flex-wrap');
            if (!host) { return; }

            topupInflight = true;
            api('GET', '/user/kc/topup/info?trade_no=' + encodeURIComponent(tn), undefined).then(function (res) {
                topupInflight = false;
                if (!res.ok || !res.data || !res.data.is_topup) { return; }
                var d = res.data;
                if (getTradeNoSafe() !== tn) { return; }
                var h = document.querySelector('section.flex-1 > section > div.flex.flex-wrap');
                if (!h || document.getElementById(TOPUP_CARD_ID)) { return; }

                detectDark();
                var t = theme();
                var done = (+d.order_status === 3) && (d.status === 'done');
                var card = document.createElement('div');
                card.id = TOPUP_CARD_ID;
                card.setAttribute('data-trade-no', tn);
                card.style.cssText = 'width:100%;margin-top:20px;box-sizing:border-box;';
                card.innerHTML =
                    '<div style="background:' + t.bg + ';border:1px solid ' + (done ? 'rgba(24,160,88,.4)' : t.border) + ';border-radius:8px;padding:20px;box-sizing:border-box;font-family:inherit;">' +
                      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">' +
                        '<span style="display:inline-block;width:4px;height:16px;background:' + t.ok + ';border-radius:2px;"></span>' +
                        '<span style="font-size:16px;font-weight:600;color:' + t.title + ';">余额充值</span>' +
                        '<span style="font-size:12px;padding:2px 8px;border-radius:4px;background:rgba(24,160,88,.12);color:' + (done ? t.ok : t.warn) + ';">' + (done ? '已到账' : '等待支付') + '</span>' +
                      '</div>' +
                      '<div style="font-size:14px;color:' + t.text + ';line-height:2;">' +
                        (done
                          ? ('本次充值 <b style="color:' + t.title + ';font-size:16px;">$' + yuan(d.amount) + '</b> 已到账账户余额' + (d.balance_after ? ('，当前余额 <b style="color:' + t.ok + ';">$' + yuan(d.balance_after) + '</b>') : '') + '。')
                          : '订单待支付，支付完成后余额将自动到账（本页会自动刷新状态）。') +
                      '</div>' +
                    '</div>';
                h.appendChild(card);

                // 待支付时轮询订单状态，完成后刷新卡片
                if (!done) {
                    var waitN = 0;
                    var waitTimer = setInterval(function () {
                        if (orderTradeNo() !== tn) { clearInterval(waitTimer); return; }
                        if (++waitN > 40) { clearInterval(waitTimer); return; }
                        api('GET', '/api/v1/user/order/check?trade_no=' + encodeURIComponent(tn), undefined).then(function (r) {
                            if (r.ok) {
                                var st = (r.data && typeof r.data.data !== 'undefined') ? r.data.data : r.data;
                                if (+st !== 0) { clearInterval(waitTimer); setTimeout(injectTopupCard, 1200); }
                            }
                        });
                    }, 4000);
                }
            }).catch(function () { topupInflight = false; });
        } catch (e) { topupInflight = false; }
    }

    function getTradeNoSafe() {
        var m = ORDER_RE.exec(window.location.hash || '');
        return m ? m[1] : '';
    }

    // ================================================================
    // 启动
    // ================================================================
    function boot() {
        buildFloatButtons();
    }

    window.addEventListener('hashchange', function () {
        setTimeout(injectTopupCard, 300);
    });
    try {
        var mo = new MutationObserver(function () {
            injectTopupCard();
        });
        mo.observe(document.body, { childList: true, subtree: true });
    } catch (e) { }

    setTimeout(boot, 400);
    setTimeout(boot, 1500);
    setTimeout(injectTopupCard, 1000);

    // URL 参数直开面板（客服引导用）：?kc_panel=topup | redeem
    try {
        var pm = /[?&]kc_panel=(topup|redeem)/.exec(window.location.search || '');
        if (pm) {
            setTimeout(function () { (pm[1] === 'topup' ? openTopup : openRedeem)(); }, 1200);
        }
    } catch (e) { }
})();
</script>
